services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/fitflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in the project .env file}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
