groups:
  - name: fitflow
    rules:
      - alert: TargetDown
        expr: up{job="fitflow-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "FitFlow API cannot be scraped" }

      - alert: DatabaseDown
        expr: fitflow_db_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Database ping is failing" }

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "95th percentile latency is above 1 second" }

      - alert: WindowsExporterDown
        expr: up{job="windows"} == 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Windows system metrics exporter is unavailable" }

      - alert: HighWindowsCpuUsage
        expr: 100 * (1 - avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Windows CPU usage has exceeded 90% for 10 minutes" }

      - alert: LowWindowsDiskSpace
        expr: windows_logical_disk_free_bytes{volume!="_Total"} / windows_logical_disk_size_bytes{volume!="_Total"} < 0.10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "A Windows logical disk has less than 10% free space" }